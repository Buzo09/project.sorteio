<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <title>Sorteio De 6 Dgitos!</title>
  </head>
  <body>
    <div class="the-box">
      <div>
        <img class="logo" src="./assets/image six numbers.png" />
      </div>
    </div>

    <div class="main">
      <h2 class="sub-title">SORTEADOR</h2>

      <div class="luck">
        <input type="number" placeholder="De" class="number-min" />
        <input type="number" placeholder="Ate" class="number-max" />
      </div>

      <div class="buttonresult">
        <button  onclick="lucknumber()" class="limiters">SORTEAR AGORA</button>
      </div>

      <div class="mapresult">
        <input type="number" placeholder="Resultado" class="result" />
      </div>
    </div>
  </body>
</html>
